function sortable(th,key){th.classList.add('sortable');th.tabIndex=0;th.title='Sort by this column';if(sortKey===key)th.setAttribute('aria-sort',asc?'ascending':'descending');const go=()=>{if(sortKey===key)asc=!asc;else{sortKey=key;asc=key==='name'||key==='county'||key==='first'}render()};th.addEventListener('click',go);th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});return th}
function rowsShown(){const min=+$('min-seasons').value,miss=+$('min-missed').value,lvl=$('level').value,q=$('search').value.trim().toLowerCase();
 return data.schools.filter(s=>s.seasons>=min&&s.missed>=miss&&(missedChip===null||s.missed===missedChip)&&(lvl==='all'||s.level===lvl)&&(!q||(s.name+' '+s.county).toLowerCase().includes(q)))}
function render(){
 const base=data.schools.filter(s=>s.seasons>=+$('min-seasons').value&&s.missed>=+$('min-missed').value&&($('level').value==='all'||s.level===$('level').value));
 const groups={};for(const s of base)groups[s.missed]=(groups[s.missed]||0)+1;

const wrap=document.querySelector('.wrap'),float=document.createElement('div');float.className='float-head';float.hidden=true;float.setAttribute('aria-hidden','true');document.body.appendChild(float);
function buildFloat(){const real=$('head').querySelector('tr');if(!real)return;const t=document.createElement('table'),copy=real.cloneNode(true);const cells=[...real.children];[...copy.children].forEach((c,i)=>{c.style.width=c.style.minWidth=c.style.maxWidth=cells[i].getBoundingClientRect().width+'px';c.removeAttribute('tabindex');c.addEventListener('click',()=>cells[i].click())});const th=document.createElement('thead');th.appendChild(copy);t.appendChild(th);t.style.width=wrap.querySelector('table').getBoundingClientRect().width+'px';float.replaceChildren(t);syncFloat()}
function syncFloat(){const head=$('head'),r=wrap.getBoundingClientRect(),h=head.getBoundingClientRect();const show=h.top<0&&r.bottom>h.height*2;float.hidden=!show;if(!show)return;float.style.left=r.left+'px';float.style.width=wrap.clientWidth+'px';float.scrollLeft=wrap.scrollLeft}
addEventListener('scroll',syncFloat,{passive:true});wrap.addEventListener('scroll',syncFloat,{passive:true});addEventListener('resize',buildFloat);new MutationObserver(buildFloat).observe($('head'),{childList:true});buildFloat();
